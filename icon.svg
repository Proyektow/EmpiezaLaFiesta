<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo degrade nocturno -->
    <radialGradient id="bgCocktail" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="60%" stop-color="#0c0717"/>
      <stop offset="100%" stop-color="#05020a"/>
    </radialGradient>

    <!-- Gradiente de luz cóctel / fiesta -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Gradiente para el líquido de las copas -->
    <linearGradient id="drinkA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <linearGradient id="drinkB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Dorado radiante para el texto -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Marco redondeado de App -->
  <rect width="512" height="512" rx="120" fill="url(#bgCocktail)"/>
  <rect width="496" height="496" x="8" y="8" rx="112" fill="none" stroke="url(#neonGlow)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Destellos de fiesta al fondo -->
  <circle cx="120" cy="110" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="390" cy="120" r="5" fill="#f43f5e" opacity="0.6"/>
  <path d="M256 70 L262 85 L277 91 L262 97 L256 112 L250 97 L235 91 L250 85 Z" fill="#ffffff" opacity="0.9"/>

  <!-- ================= DOS CÓCTELES BRINDANDO ================= -->
  <!-- Copa Izquierda (Inclinada hacia la derecha) -->
  <g transform="translate(225, 205) rotate(16) translate(-225, -205)">
    <!-- Líquido -->
    <polygon points="175,145 225,200 275,145" fill="url(#drinkA)"/>
    <!-- Cristal copa martini -->
    <path d="M165 135 L225 210 V270 H205 V282 H245 V270 H225 V210 L285 135 Z" 
          stroke="#f8fafc" stroke-width="8" stroke-linejoin="round" fill="none" opacity="0.9"/>
    <!-- Rodaja de lima decorativa -->
    <circle cx="165" cy="135" r="14" fill="#84cc16"/>
    <circle cx="165" cy="135" r="9" fill="#bef264"/>
  </g>

  <!-- Copa Derecha (Inclinada hacia la izquierda) -->
  <g transform="translate(287, 205) rotate(-16) translate(-287, -205)">
    <!-- Líquido -->
    <polygon points="237,145 287,200 337,145" fill="url(#drinkB)"/>
    <!-- Cristal copa martini -->
    <path d="M227 135 L287 210 V270 H267 V282 H307 V270 H287 V210 L347 135 Z" 
          stroke="#f8fafc" stroke-width="8" stroke-linejoin="round" fill="none" opacity="0.9"/>
    <!-- Pajita / Sorbete -->
    <line x1="260" y1="100" x2="295" y2="185" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Chispas de choque / brindis en el centro -->
  <circle cx="256" cy="148" r="8" fill="#ffffff"/>
  <circle cx="270" cy="130" r="4" fill="#fb923c"/>
  <circle cx="242" cy="132" r="4" fill="#38bdf8"/>

  <!-- ================= TEXTO CENTRAL DESTACADO ================= -->
  <g filter="url(#shadowFilter)">
    <!-- Placa de contraste -->
    <rect x="36" y="325" width="440" height="135" rx="26" 
          fill="#0c0717" fill-opacity="0.9" 
          stroke="url(#neonGlow)" stroke-width="3"/>

    <!-- EMPIEZA -->
    <text x="256" y="380" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Impact', 'Segoe UI Black', Roboto, sans-serif" 
          font-size="46" 
          font-weight="950" 
          letter-spacing="4"
          fill="url(#goldText)">EMPIEZA</text>

    <!-- LA FIESTA -->
    <text x="256" y="432" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Impact', 'Segoe UI Black', Roboto, sans-serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="5"
          fill="#ffffff">LA FIESTA</text>
  </g>
</svg>
